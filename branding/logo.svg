<svg xmlns="http://www.w3.org/2000/svg" width="460" height="104" viewBox="0 0 460 104">
  <title>Phoenix Smartboard — primary logo</title>
  <desc>Phoenix Smartboard emblem with soaring flame stylus beside a modern geometric wordmark.</desc>
  <defs>
    <linearGradient id="logoFlame" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="60%" stop-color="#f77f00"/>
      <stop offset="100%" stop-color="#fcbf49"/>
    </linearGradient>
    <linearGradient id="logoWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#d62828"/>
    </linearGradient>
  </defs>

  <!-- Icon Mark -->
  <g transform="translate(10, 8) scale(0.6875)">
    <rect width="128" height="128" rx="28" fill="#1e2229" stroke="#333b47" stroke-width="2"/>
    <rect x="18" y="18" width="92" height="92" rx="14" fill="#181b20" stroke="#3c4656" stroke-width="1.5"/>
    <path d="M26 84 C42 88 56 76 64 66 C72 76 86 88 102 84 C96 66 84 56 64 56 C44 56 32 66 26 84 Z" fill="url(#logoWing)" opacity="0.9"/>
    <path d="M64 26 C64 26 76 44 76 56 C76 64 70 70 64 70 C58 70 52 64 52 56 C52 44 64 26 64 26 Z" fill="url(#logoFlame)"/>
    <polygon points="64,22 66,28 62,28" fill="#ffffff"/>
    <circle cx="64" cy="56" r="3.5" fill="#111214"/>
    <line x1="64" y1="59.5" x2="64" y2="70" stroke="#111214" stroke-width="2"/>
    <path d="M38 98 Q64 104 90 98" stroke="url(#logoFlame)" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Typography Wordmark -->
  <text x="116" y="52" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5" fill="#e63946">PHOENIX</text>
  <text x="116" y="78" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" letter-spacing="3" fill="#2a9d8f">SMARTBOARD</text>
  <path d="M116 88 h310" stroke="#e63946" stroke-width="2.5" stroke-linecap="round"/>
</svg>
